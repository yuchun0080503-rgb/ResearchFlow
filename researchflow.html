<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResearchFlow</title>
<style>
:root{--page:#f2f5fb;--bg:#fdfeff;--fg:#1c222e;--mute:#6b7386;--line:#e1e6f0;--soft:#eaeffb;--ac:#3d6bdc;--ac2:#e8834a;--ok:#1f9d68;--warn:#c98a12;--bad:#dd4a4a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#171310;--bg:#1f1a15;--fg:#f1e9dd;--mute:#ab9a86;--line:#332a20;--soft:#271f18;--ac:#e9a25c;--ac2:#c893f5}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--page);color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}button.pri:hover:not(:disabled){opacity:.85;background:var(--fg)}
button.on{border-color:var(--ac);color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
select{width:auto;padding:5px 8px}
h1,h2,h3{margin:0;font-weight:600}.mute{color:var(--mute)}.sm{font-size:13px}.sp{flex:1}.hide{display:none!important}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px;flex:none}
header{height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;cursor:pointer;letter-spacing:.01em}
.date{display:flex;align-items:center;background:var(--soft);border-radius:14px;padding:6px 14px 6px 12px;gap:10px;line-height:1.15}
.date b{font-size:30px;font-weight:300;letter-spacing:-.02em}
.date span{border-left:1px solid var(--line);padding-left:10px;font-size:12px;color:var(--mute)}
.date span em{display:block;font-style:normal;color:var(--fg);font-size:13px}
.avb{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);color:#fff;font-weight:600;display:grid;place-items:center}
.menu{position:absolute;right:28px;top:58px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;width:250px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.menu button{width:100%;text-align:left;border:0;margin-top:4px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;flex:none}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:20px 28px 64px}
.big{background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:0 1px 2px rgba(20,20,40,.03),0 12px 32px -18px rgba(20,20,40,.14)}
.home{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:28px}
@media(max-width:820px){.home{grid-template-columns:1fr}}
.bh{display:flex;align-items:center;gap:14px;margin-bottom:20px}.bh h3{font-size:20px}
.badge{width:44px;height:44px;border-radius:16px;background:var(--soft);display:grid;place-items:center}.badge .ic{margin:0;width:22px;height:22px}
.row{padding:15px 18px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:var(--ac);box-shadow:0 6px 18px -12px rgba(77,107,255,.35)}.row .gap{flex-basis:100%;color:var(--mute);font-size:13px}
.stack{display:flex}.stack .av{margin-left:-6px;border:2px solid var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:18px;margin:26px 0 18px}
.seg button{border:0;border-radius:14px;padding:10px;color:var(--mute)}.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
#v-login .big{max-width:520px;margin:9vh auto 0}#v-login h1{font-size:clamp(26px,4.5vw,34px);line-height:1.35;margin-bottom:14px}
.big button.pri{border-radius:14px;padding:11px 18px}.big input{border-radius:12px}
#v-ws{height:calc(100% - 64px);background:var(--bg)}
#ws{display:grid;grid-template-columns:minmax(0,1fr) 430px;height:100%}#cv{position:absolute;left:0;top:0;width:100%;height:100%}#v-ws:has(#ws.full){animation:none}
@media(max-width:900px){#ws{grid-template-columns:1fr;grid-template-rows:55% 45%}}
.cv{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.pbar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.pbar b{font-size:14.5px;font-weight:700}.pbar button{border:0;padding:6px 10px;background:transparent;border-radius:11px}.pbar button:hover{background:var(--bg)}
#pst{background:var(--ac);color:#fff;border:0;font-weight:600;padding:3px 12px}
.cvw{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.tools{position:absolute;top:14px;left:14px;display:flex;gap:2px;background:var(--bg);padding:5px;border:1px solid var(--line);border-radius:18px;z-index:2;flex-wrap:wrap;max-width:calc(100% - 28px);box-shadow:0 6px 20px -10px rgba(80,50,10,.25)}
.tools button{border:0;padding:7px 11px;font-size:13px;border-radius:13px-}.tools button.on{background:var(--ac);color:#fff}
.tools input[type=range]{width:64px;padding:0;border:0;align-self:center}.tools .vr{width:1px;background:var(--line);margin:4px 4px}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px;z-index:2;box-shadow:0 6px 20px -10px rgba(80,50,10,.22)}
.zoom button{border:0;padding:4px 8px}.zoom .ic{margin:0}.zoom .vr{width:1px;align-self:stretch;background:var(--line);margin:4px 3px}
#lost{position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:2;border-radius:99px;padding:7px 16px;font-size:13px;background:var(--fg);color:var(--bg);border:0;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
#ws.full{position:fixed;inset:0;z-index:50;background:var(--page);grid-template-columns:1fr!important;grid-template-rows:1fr!important}#ws.full .side{display:none}#ws.full .cv{border-right:0}
.syb{position:absolute;left:14px;bottom:14px;z-index:2;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px 13px;font-size:12px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px -10px rgba(80,50,10,.22)}
.syb button{border:0;padding:0 4px;font-size:12px;color:var(--ac)}
.insp{position:absolute;left:10px;right:10px;bottom:52px;z-index:3;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px;max-height:46%;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.insp .ib{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.insp .ib button{padding:3px 9px;font-size:13px}
.insp .kv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px;color:var(--mute)}
.insp label{display:inline-flex;align-items:center;gap:5px;margin:4px 12px 0 0;color:var(--fg)}.insp label input{width:auto}
.ti{position:absolute;z-index:4;font:15px "Noto Sans TC",sans-serif;border:1px solid var(--ac);min-width:140px;width:auto;padding:3px 7px}
.side{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:12px 12px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--soft)}
.tabs button{flex:none;border:1px solid transparent;border-radius:99px;padding:7px 13px;color:var(--mute);font-size:12.5px;background:var(--bg);display:flex;align-items:center;gap:5px}
.tabs button .ic{margin:0;width:14px;height:14px}
.tabs button.on{color:#fff;background:var(--ac);border-color:var(--ac)}
.pane{overflow:auto;padding:20px 18px;flex:1;font-size:14px;line-height:1.6}
.pane h3{font-size:11.5px;font-weight:700;margin:26px 0 8px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}.pane h3:first-child{margin-top:2px}

.ah{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 7%,var(--bg)),color-mix(in srgb,var(--ac2) 6%,var(--bg)));border:1px solid var(--line);margin-bottom:12px}
.ab{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line);color:var(--ac)}
.flow{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.flow span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute)}
#boot{display:none}.boot #boot{display:grid;place-items:center;position:fixed;inset:64px 0 0;color:var(--mute);font-size:14px;z-index:30;background:var(--page)}.boot #v-login{visibility:hidden}
.flow .go{cursor:pointer;transition:background .15s,color .15s}.flow .go:hover,.flow .go:focus-visible{background:var(--ac);color:#fff}
.flow .d{background:color-mix(in srgb,var(--ok) 16%,var(--soft));color:var(--ok)}.flow .c{background:var(--ac);color:#fff}
.box{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.warn{border-color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chips button{font-size:13px;padding:3px 11px;border-radius:99px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 16%, transparent)}.g{background:var(--ok);color:var(--ok)}.y{background:var(--warn);color:var(--warn)}.r{background:var(--bad);color:var(--bad)}
.hl{display:grid;grid-template-columns:118px 1fr;column-gap:14px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:start;font-size:13.5px;line-height:1.55}
.hl.tt{grid-template-columns:50px 1fr}
.hl span:first-child{color:var(--mute);font-size:12px;padding-top:2px}
.hl span:last-child{color:var(--fg);word-break:break-word;display:block}
.hl span:last-child div{margin-top:4px}
.hl span:last-child div:first-child{margin-top:0}
.hl .st{display:inline-flex;align-items:center;gap:7px}
.ev{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin:12px 0}.ev.cn{border-color:#e2662b}.ev.un{border-color:var(--warn)}
.ev summary{cursor:pointer}.ev p{margin:4px 0;font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex;margin:6px 0}.bar i{display:block;height:100%}
dialog{border:1px solid var(--line);border-radius:28px;background:var(--bg);color:var(--fg);width:min(560px,94vw);padding:28px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.mrow{display:grid;grid-template-columns:auto 1fr 110px 1fr auto;gap:8px;align-items:center;margin:8px 0}
@media(max-width:560px){.mrow{grid-template-columns:auto 1fr 1fr}}
.sw{display:flex;gap:8px;margin-top:6px}.sw button{width:30px;height:30px;border-radius:50%;padding:0}.sw button.on{outline:2px solid var(--fg);outline-offset:2px}
.note{font-size:12px;color:var(--mute);margin-top:22px}
.tlay{display:grid;grid-template-columns:270px 1fr;gap:28px;max-width:1240px;margin:0 auto;padding:16px 28px 72px;align-items:start}
.tside{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px}.tside label{margin-top:0}
.tlab{font-size:12.5px;color:var(--mute);font-weight:600;margin:18px 2px 4px}
.tgrp{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;border:1px solid transparent;border-radius:14px;padding:11px 14px;background:none}
.tgrp:hover{background:var(--soft)}.tgrp.on{background:var(--soft);border-color:color-mix(in srgb,var(--ac) 30%,var(--line))}
.tgrp b{font-size:14.5px}.tgrp span{font-size:12.5px;color:var(--mute)}.tgrp .idle{color:#c8501e}
.tmain{min-width:0}.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 12px}.thead h1{font-size:30px;flex:1;min-width:0}
.tchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tchips>span:not(.tag){font-size:13px;padding:4px 12px;border-radius:99px}
.tcard{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:24px 26px;margin-top:20px;box-shadow:0 1px 2px rgba(20,20,40,.03),0 12px 32px -22px rgba(20,20,40,.14)}
.tcard h2{font-size:19px;margin:0 0 4px}.tch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tprog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 16px;margin-top:16px}
.tprog>div{border-top:3px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}.tprog>div.s-g{border-color:var(--ac)}.tprog>div.s-y{border-color:var(--warn)}
.tprog b{font-size:14px}.tprog span{font-size:12.5px;color:var(--mute)}
.lvs{display:grid;gap:8px;margin-top:14px}
.lvopt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;margin:0}
.lvopt.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.lvopt input{width:auto;margin-top:4px;accent-color:var(--ac)}
.lvopt>span{display:flex;flex-direction:column;gap:2px;color:var(--fg);font-size:14.5px}.lvopt>span>span{font-size:12.5px;color:var(--mute)}
.ttab{width:100%;border-collapse:collapse;font-size:13.5px}.ttab th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ttab td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}.ttab td:first-child,.ttab td:nth-child(2),.ttab td:last-child{white-space:nowrap}.ttab tr:last-child td{border-bottom:0}
.tag.blk{background:color-mix(in srgb,#e2662b 12%,var(--bg));color:#c8501e;border-color:transparent}
#tmini{display:block;width:100%;height:340px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
#tbadge{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
@media(max-width:860px){.tlay{grid-template-columns:1fr;padding:12px 16px 56px}.tside{position:static}.thead h1{font-size:24px}.tcard{padding:18px}.ttab td:nth-child(3){min-width:180px}.tcard{overflow-x:auto}}
.lor{display:flex;align-items:center;gap:12px;margin:14px 0 10px;color:var(--mute);font-size:12.5px}.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.evzh{font-size:13px;color:var(--fg);font-weight:400;margin-top:4px;line-height:1.55}.evzh:empty{display:none}.ev.sv{border-color:var(--ac);margin:10px 0}
.aiby{color:var(--ac);margin:0 0 8px;display:flex;gap:6px;align-items:flex-start}.aiby .ic{flex:none;margin:2px 0 0;width:15px;height:15px}
.tsub{margin:-4px 0 10px}
.trow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;align-items:start}
.tname{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}.tname span{color:var(--mute);font-size:12px}
.tbar{height:8px;border-radius:99px;background:var(--soft);margin:5px 0;overflow:hidden}.tbar i{display:block;height:100%;border-radius:99px}
.tal{font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:7px 11px;margin:8px 0;color:var(--mute)}.tal.warn{border-color:var(--warn);color:var(--fg)}
.tgh{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-size:13.5px}.tgh .mute:last-child{margin-left:auto;font-size:12px}
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0 8px 3px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
.tk input{width:auto;margin-top:5px}.tk>button{border:0;padding:2px;color:var(--mute);background:none}.tk.done>div>div:first-child{color:var(--mute)}
.tk .tclaim{font-size:12.5px;padding:2px 10px;margin-top:5px}
.tadd{display:grid;gap:6px;margin:10px 0 4px}.tadd div{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
#tm{width:min(1040px,96vw)}.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.tgrid h3:first-child{margin-top:8px}
@media(max-width:760px){.tgrid{grid-template-columns:1fr;gap:8px}}
.stage{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 9%,var(--bg)),color-mix(in srgb,var(--ac2) 7%,var(--bg)));border:1px solid var(--line);margin-bottom:4px}
.stage .sb{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--ac);flex:none;box-shadow:0 0 0 1px var(--line)}
.stage .sb .ic{margin:0}
.stage b{font-size:14.5px}
.hl .st{display:flex;align-items:center;gap:7px}
.hl.sync{opacity:.55}
.tag.ai{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag.sys{background:var(--warn);color:#fff;border-color:var(--warn)}
.tag.sync{background:transparent;border-color:transparent;padding-left:0}
/* 兩種查證模式各有自己的顏色：正反例證＝綠／橘兩色（兩方並陳），主張論證＝單一藍色（專注一個主張） */
.mode-procon,.mode-claim{background-repeat:no-repeat;background-size:6px 100%;padding-left:20px!important}
.mode-procon{background-image:linear-gradient(var(--ok) 50%,#e2662b 50%)}
.mode-claim{background-image:linear-gradient(var(--ac),var(--ac))}
.tag.m-procon{background:linear-gradient(90deg,var(--ok) 50%,#e2662b 50%);color:#fff;border-color:transparent}
.tag.m-claim{background:var(--ac);color:#fff;border-color:var(--ac)}
.mt{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px}.mt span:nth-child(odd){color:var(--mute)}
.mopt{display:block;width:100%;text-align:left;margin-top:12px;padding:14px 16px;border-radius:16px}
.mopt:hover:not(:disabled){border-color:var(--ac);background:var(--bg)}
.advice{border-left:3px solid var(--ac2);padding:2px 0 2px 12px;margin:16px 0 4px;font-size:13.5px}
/* 關鍵字：一個關鍵字一顆膠囊；中文關鍵字的英文翻譯直接顯示在裡面，點英文就能修改 */
.kwc{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 4px 2px 11px;border:1px solid var(--line);border-radius:99px}
.kwc .kwt{color:var(--ac);cursor:pointer;border-bottom:1px dotted var(--ac)}
.kwc .kwn{cursor:pointer}.kwc.core{border-color:var(--fg)}.kwc.core .kwn{font-weight:700}
/* 我的研究：自己建立的研究可以向左滑，露出後面的刪除鈕 */
.rowwrap{display:flex;align-items:stretch;margin-bottom:8px}
.rowwrap .row{flex:1;min-width:0;margin-bottom:0;touch-action:pan-y;user-select:none}
.rowdel{flex:none;width:0;margin-left:0;padding:0;border:0 solid color-mix(in srgb,var(--bad) 38%,var(--line));border-radius:16px;overflow:hidden;opacity:0;white-space:nowrap;
 background:color-mix(in srgb,var(--bad) 8%,var(--bg));color:var(--bad);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
 transition:width .22s,margin-left .22s,opacity .18s,background .15s,color .15s}
.rowdel .ic{margin:0;width:18px;height:18px}
.rowwrap.open .rowdel{width:84px;margin-left:8px;border-width:1px;opacity:1}
.rowwrap.drag .rowdel{transition:none;border-width:1px}
.rowdel:hover:not(:disabled){background:var(--bad);border-color:var(--bad);color:#fff}

@keyframes flt{50%{transform:translateY(-14px)}}
@keyframes vin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

<script type="module">
// 第一步地基：Firebase Auth + Firestore。這段用動態 import，所以就算 firebase-config.js
// 不存在或連不上，也只是靜靜留在 demo 模式——下面主程式完全不受影響，不會白屏。
window.RF_MODE = "demo";
// 手寫與圖示的自動偵測（src/ink.mjs）跟 Firebase 無關，展示模式也能用；載入失敗就退回手動輸入。
window.RF_VER = "2026.10.11-4";
// 查證模式的建議、主張轉研究問題、中文轉英文關鍵字都是純函式（src/agent-local.mjs），展示模式也用得到。
try { window.RFTEAM = await import("./src/teamwork.mjs"); } catch (err) { console.info("[ResearchFlow] 無法載入 teamwork.mjs：", err?.message || err); }
// 本機模型：使用者電腦上的 Ollama（Qwen）。有偵測到時，關鍵字規劃、翻譯、文獻判讀、手寫辨識都交給它；沒有就用規則式。
try { window.RFLLM = await import("./src/llm.mjs"); window.RFAI = await import("./src/agent-llm.mjs"); window.RFLLM.detect().then(() => window.dispatchEvent(new Event("rf:llm"))); } catch (err) { console.info("[ResearchFlow] 無法載入本機模型模組：", err?.message || err); }
try { window.RFAGENT = await import("./src/agent-local.mjs"); } catch (err) { console.info("[ResearchFlow] 無法載入 agent-local.mjs：", err?.message || err); }
try {
  window.RFINK = await import("./src/ink.mjs");
  // 詞庫（常用詞對照表）在背景載入，用來校正手寫辨識；載入前或載入失敗時辨識照常運作，只是少了詞庫校正。
  window.RFINK.loadLexicon("./src/lexicon-zh.txt").then(() => window.dispatchEvent(new Event("rf:lexicon")), (err) => console.info("[ResearchFlow] 詞庫載入失敗：", err?.message || err));
} catch (err) { console.info("[ResearchFlow] 無法載入 ink.mjs，手寫內容改為手動輸入。", err?.message || err); }
try {
  const { firebaseConfig } = await import("./src/firebase-config.js");
  if (!firebaseConfig || /YOUR_/.test(firebaseConfig.apiKey || "YOUR_")) throw new Error("firebase-config.js 尚未填入真實設定值");
  const rfdb = await import("./src/db.mjs");
  window.RFDB = rfdb;
  window.RF_MODE = "live";
  console.info("[ResearchFlow] Firebase 已連接，使用真實資料。");
} catch (err) {
  console.info("[ResearchFlow] 未偵測到 src/firebase-config.js，使用展示用假資料。", err?.message || err);
}
window.dispatchEvent(new Event("rf:ready"));
</script>

function attachLiveProjects(){

  const docs=all.filter(d=>!d.deleting);
  const mapped=await Promise.all(docs.map(async d=>{
   const mem=await RFDB.getMembers(d.id);
   mem.forEach(m=>{if(m.uid!==ME)U[m.uid]={n:m.displayName||m.email||"組員",c:m.color||CO[hashCode(m.uid)%CO.length],email:m.email||"",id:m.uid}});
   const ORD={owner:0,editor:1,viewer:2,teacher:3};mem.sort((a,b)=>(ORD[a.role]??9)-(ORD[b.role]??9));
   // 沿用同一個本地 project 物件（畫布、Agent 狀態、復原歷史都掛在上面），只更新來自 Firestore 的欄位
   const q=projects.find(x=>x.fid===d.id)||mkP({fid:d.id,ver:0,objs:[]});
   return Object.assign(q,{mode:d.searchMode||"",name:d.name,course:d.course||"",req:d.teacherReq||"",due:d.dueDate||"",field:d.field||"",reportType:d.reportType||"",reportUrl:d.reportUrl||"",

  }));

function renderProj(){const mine=q=>(LIVE()||ROLE==="s")&&roleIn(q)==="Owner";

 $$("#plist .row").forEach(r=>{let x0=null,dx=0,moved=false;const wrap=r.parentNode,del=wrap.querySelector(".rowdel"),W=84;

  r.onclick=()=>{if(moved){moved=false;return}if(wrap.classList.contains("open")){close();return}openWs(+r.dataset.i)};

  try{await RFDB.deleteProject(q.fid,ME)}catch(err){alert("刪除失敗（可能只刪了一部分，重新登入後會自動繼續）："+(err?.message||err));btn.disabled=false}

 projects.splice(projects.indexOf(q),1);if(p===q)p=null;renderProj()}

 catch(e){console.warn("[ResearchFlow] 模型讀取手寫失敗，保留筆跡辨識的結果：",e?.message||e)}}
async function imgRec(b){const xs=[],ys=[];b.forEach(o=>o.pts.forEach(q=>{xs.push(q[0]);ys.push(q[1])}));
 const x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0||1,h=Math.max(...ys)-y0||1,k=Math.min(900/w,300/h,4),pd=24;
 const c=document.createElement("canvas");c.width=Math.ceil(w*k+pd*2);c.height=Math.ceil(h*k+pd*2);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.strokeStyle="#000";g.lineWidth=4;g.lineCap=g.lineJoin="round";
 b.forEach(o=>{g.beginPath();o.pts.forEach((q,i)=>{const X=(q[0]-x0)*k+pd,Y=(q[1]-y0)*k+pd;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()});
 const bl=await new Promise(r=>c.toBlob(r,"image/png"));
 if(!SAMP){const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(bl)});
  return((await RFDB.readHandwriting(p.fid,b64)).text||"").trim()}
 const r=await SAMP("這張圖片是使用者在畫布上的手寫內容（可能是繁體中文、英文或數字）。只輸出辨識到的文字本身，不要任何說明；若不是文字則輸出空字串。",{images:bl,modelTier:"quick",cache:false});return(r.text||"").trim()}
async function runHW(){const proj=p,INK=window.RFINK;let b=hwQ.splice(0).map(o=>getO(o.id)).filter(Boolean);if(!b.length)return;
 // 上一組（20 秒內、就在旁邊、還沒被確認）可以接著寫：新筆畫會跟它合併重新辨識
 const prev=INK&&lastHW&&lastHW.proj===proj&&Date.now()-lastHW.at<20000?lastHW.ids.map(getO).filter(Boolean):null;
 const joinable=prev&&prev.length===lastHW.ids.length&&!prev[0].conf&&hwNear(prev,b);
 let shape=INK&&INK.classifyGroup(b.map(o=>o.pts)),desc="";
 if(shape){const ids=new Set(b.map(o=>o.id)),others=p.objs.filter(o=>!ids.has(o.id)&&hwText(o)).map(o=>({label:hwText(o),box:bbox(o)}));
  desc=INK.describeShape(shape,others);
  // 沒有圈到或連到任何內容的線條，如果是緊接在上一組旁邊畫的，其實是字的筆畫（「十」的一橫一豎、句子裡的「一」），不是圖示
  if(joinable&&desc.startsWith("圖示：")&&(lastHW.shape||Date.now()-lastHW.at<6000))shape=null}
 // 緊貼著還沒確認的手寫字畫的線條（沒有圈到或連到任何內容），其實是字的一部分——不管隔了多久
 if(shape&&desc.startsWith("圖示：")&&hwGrow(b).some(o=>!b.includes(o)&&!o.shape))shape=null;
 if(shape){b.forEach((o,i)=>{o.sg=1;if(i)o.hwSub=1;else{o.aiRead=desc;o.shape=shape.kind}});
  lastHW=desc.startsWith("圖示：")?{proj,ids:b.map(o=>o.id),at:Date.now(),shape:true}:null;draw();insp();syncObjsLive(false);return}
 if(joinable){prev.forEach(o=>{delete o.shape;delete o.sg});b=[...prev,...b]}
 b=hwGrow(b);b.forEach(o=>{delete o.sg});
 const ids=b.map(o=>o.id);b.forEach(o=>o.hwBusy=1);draw();let t="";
 let alts=[];
 try{if(HW)t=await nativeRec(b);if(!t&&INK){const r=await INK.recognizeInkDetailed(b.map(o=>o.pts));t=r.text;alts=r.alts}if(!t&&SAMP)t=await imgRec(b);if(!t&&AIV())t=await RFAI.readInk(await inkPNG(b),"");hwErr=""}catch(e){console.warn("[ResearchFlow] 手寫辨識失敗：",e?.message||e);hwErr=/Failed to fetch|Load failed|NetworkError/i.test(e?.message||"")?"連不上辨識服務":String(e?.message||e).slice(0,30)}
 hwLabel();
 if(p!==proj)return;
 b=ids.map(getO).filter(Boolean);
 b.forEach((o,i)=>{delete o.hwBusy;delete o.alts;if(t){if(i){o.hwSub=1;o.aiRead=""}else{o.aiRead=t;delete o.hwSub;if(alts.length)o.alts=alts}}});
 lastHW=t&&b.length?{proj,ids:b.map(o=>o.id),at:Date.now()}:null;
 draw();insp();syncObjsLive(false);if(t&&b.length)hwRefine(b.map(o=>o.id),t)}
function drawHW(){if(!p)return;ctx.font="12px 'Noto Sans TC',sans-serif";for(const o of p.objs){if(o.type!=="stroke")continue;if(o.hwBusy||(o.aiRead&&!o.hwSub&&!o.conf)){const b=bbox(o);ctx.fillStyle=o.hwBusy?cssv("--mute"):cssv("--ac");ctx.fillText(o.hwBusy?"辨識中…":"AI 讀取："+o.aiRead+"（待確認）",b.x,b.y+b.h+14)}}}
cv.addEventListener("contextmenu",e=>e.preventDefault());cv.addEventListener("pointerleave",e=>{if(e.pointerType!=="touch"&&eraPos){eraPos=null;rdraw()}});cv.addEventListener("selectstart",e=>e.preventDefault());cv.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
